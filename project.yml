name: SnowOps
options:
  bundleIdPrefix: com.snowops
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SnowOps:
    type: application
    platform: iOS
    sources: [SnowOps]
    dependencies:
      - package: SnowOpsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowops.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Snow Ops
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach service photos to document completed work.
        INFOPLIST_KEY_NSCameraUsageDescription: Photograph completed services and site issues.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Record your location when documenting a service visit.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  SnowOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SnowOpsTests]
    dependencies:
      - target: SnowOps
packages:
  SnowOpsCore:
    path: .
schemes:
  SnowOps:
    build:
      targets:
        SnowOps: all
    test:
      targets: [SnowOpsTests]
